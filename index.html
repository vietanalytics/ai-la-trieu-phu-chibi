<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf6ff">
</head>
<body>
<title>Ai là triệu phú Chibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap&subset=vietnamese">
<style>
/* Layout: sticker-style cartoon world — sky map home, indigo spotlight stage for play.
   Deliberately a single bright visual world (kids' game), colors set explicitly. */
:root{
  --sky:#8fd0f7; --sky-soft:#e4f4ff; --sky-deep:#2c78bd;
  --lav:#c3b3f5; --lav-soft:#f1ecff; --lav-deep:#6a52c9;
  --sun:#ffd451; --sun-deep:#f2a900;
  --peach:#ffb894; --peach-soft:#fff0e7;
  --mint:#8ee3c3; --mint-deep:#1f9e74;
  --berry:#ef5a6f;
  --ink:#2a2852; --ink-soft:#5b5986; --line:#2a2852;
  --card:#ffffff; --page:#eaf6ff;
  --stage1:#211b5c; --stage2:#3c2c8f;
  --f-display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:20px; --sh:0 5px 0 var(--line);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 40px;min-height:100%;
  background:
   radial-gradient(circle at 12% 8%, #ffffff 0 40px, transparent 41px),
   radial-gradient(circle at 88% 4%, #ffffff 0 30px, transparent 31px),
   linear-gradient(180deg,var(--sky-soft),var(--page) 420px);
}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px;border-radius:12px}
.wrap{max-width:1180px;margin-inline:auto}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px;background:rgba(234,246,255,.92);backdrop-filter:blur(8px);border-bottom:2.5px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1}
.logo b span{color:var(--lav-deep)}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nbtn{border:2.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.nbtn[aria-pressed="true"],.nbtn.on{background:var(--sun)}
.nbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.nbtn svg{width:18px;height:18px}

/* ---------- generic ---------- */
.btn{border:3px solid var(--line);border-radius:999px;padding:12px 22px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;box-shadow:var(--sh);background:var(--sun);transition:transform .12s, box-shadow .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 var(--line)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn:disabled{opacity:.45;box-shadow:0 3px 0 var(--line)}
.btn.lav{background:var(--lav)} .btn.mint{background:var(--mint)} .btn.peach{background:var(--peach)} .btn.white{background:var(--card)} .btn.sky{background:var(--sky)}
.btn.sm{padding:8px 14px;font-size:.95rem;box-shadow:0 3px 0 var(--line)}
.panel{background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);padding:22px}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lav-deep)}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:800;font-size:.8rem;background:var(--card);white-space:nowrap}
.muted{color:var(--ink-soft)}
.screen{padding-block:22px 10px}
.notice{border:2.5px dashed var(--lav-deep);background:var(--lav-soft);border-radius:16px;padding:10px 14px;font-weight:700;font-size:.95rem}
.notice.warn{border-color:var(--berry);background:#ffeef0}

/* ---------- home hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;padding-block:26px 8px}
.hero h1{font-size:clamp(2.3rem,6vw,4rem);font-weight:800;letter-spacing:-.01em}
.hero h1 .c{color:var(--lav-deep);display:inline-block;transform:rotate(-3deg);background:var(--sun);border:3px solid var(--line);border-radius:18px;padding:0 12px;box-shadow:0 5px 0 var(--line);margin-left:4px}
.hero .lead{font-size:1.15rem;max-width:34em;margin-top:14px;font-weight:600}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.mc-stage{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:260px}
.mc-stage .podium{position:absolute;bottom:0;width:78%;height:46px;border-radius:50%;background:var(--lav);border:3px solid var(--line)}
.mc-stage svg.mc{position:relative;width:min(240px,60vw);height:auto;filter:drop-shadow(0 6px 0 rgba(42,40,82,.15))}
.bubble{position:relative;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px 16px;font-weight:800;font-family:var(--f-display);font-size:1.08rem;box-shadow:0 4px 0 var(--line);max-width:280px}
.mc-stage .bubble{position:absolute;top:0;right:0}
.bubble::after{content:"";position:absolute;left:30px;bottom:-14px;width:20px;height:20px;background:var(--card);border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.statusline{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ---------- map ---------- */
.map{margin-top:26px;border:3px solid var(--line);border-radius:32px;padding:24px;position:relative;overflow:hidden;box-shadow:0 7px 0 var(--line);
  background:
   repeating-linear-gradient(0deg, transparent 0 59px, rgba(44,120,189,.13) 59px 61px),
   repeating-linear-gradient(90deg, transparent 0 59px, rgba(44,120,189,.13) 59px 61px),
   #cfeafc;}
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;position:relative}
.map-head h2{font-size:clamp(1.6rem,3.6vw,2.3rem)}
.compass{width:74px;height:74px;flex:none}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;position:relative}
.region{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .15s}
.region:hover{transform:translateY(-3px) rotate(-.4deg)}
.region .isle{height:96px;border-radius:18px;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.region .isle svg{width:76px;height:76px;position:relative}
.region .isle::before{content:"";position:absolute;inset:auto -10% -40% -10%;height:70%;border-radius:50%;background:rgba(255,255,255,.45)}
.region h3{font-size:1.2rem}
.region .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.region .num{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.region.locked{filter:grayscale(.85);opacity:.75}
.region .btn{width:100%;margin-top:auto}

.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:26px}
.mini-me{display:flex;gap:16px;align-items:center}
.mini-me svg{width:90px;height:auto;flex:none}
.xpbar{height:16px;border:2.5px solid var(--line);border-radius:999px;background:var(--sky-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#4fd1a0);border-right:2.5px solid var(--line)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:900px;margin-inline:auto}
.step h2{font-size:1.45rem;display:flex;align-items:center;gap:10px}
.step h2 .n{width:34px;height:34px;border-radius:50%;background:var(--sun);border:2.5px solid var(--line);display:inline-grid;place-items:center;font-size:1.05rem;flex:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.mode{border:3px solid var(--line);border-radius:22px;background:var(--card);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--line)}
.mode h3{font-size:1.25rem}
.mode[aria-pressed="true"]{background:var(--sun);transform:translateY(-2px)}
.mode ul{margin:4px 0 0;padding-left:18px;font-size:.92rem;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.seg button{border:2.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.seg button[aria-pressed="true"]{background:var(--lav)}
.seg button:disabled{opacity:.45}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tchip{border:2.5px solid var(--line);border-radius:14px;background:var(--card);padding:6px 10px 6px 6px;font-weight:800;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.tchip svg{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);padding:2px}
.tchip[aria-pressed="true"]{background:var(--mint)}
.tchip:disabled{opacity:.4}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.field label{font-weight:800;font-size:.9rem;display:block;margin-bottom:4px}
select,input[type=text],input[type=password],input[type=email]{font:inherit;font-weight:700;border:2.5px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card);color:var(--ink)}
.startbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.poolinfo{font-weight:800;font-size:1.05rem}

/* ---------- stage ---------- */
.stage{margin-inline:-16px;padding:18px 16px 26px;min-height:calc(100vh - 64px);color:#fff;
  background:
   radial-gradient(ellipse 60% 40% at 50% -5%, rgba(255,212,81,.35), transparent 70%),
   radial-gradient(circle at 20% 30%, rgba(255,255,255,.7) 0 1.5px, transparent 2px),
   radial-gradient(circle at 70% 18%, rgba(255,255,255,.6) 0 1.5px, transparent 2px),
   radial-gradient(circle at 85% 60%, rgba(255,255,255,.5) 0 1.5px, transparent 2px),
   radial-gradient(circle at 35% 75%, rgba(255,255,255,.5) 0 1.5px, transparent 2px),
   linear-gradient(180deg,var(--stage1),var(--stage2));}
.stage-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;max-width:1180px;margin-inline:auto}
.stage-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stage-top .chip{background:var(--lav-soft);color:var(--ink)}
.stage-top .chip.lv{background:var(--sun)}
.stage-top .grow{flex:1}
.ghost{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:.88rem}
.ghost:hover{background:rgba(255,255,255,.12)}
.host{display:flex;align-items:flex-end;gap:12px;margin-bottom:28px;min-height:110px}
.host svg.mc{width:96px;height:auto;flex:none}
.host .bubble{color:var(--ink);font-size:1rem;max-width:none}
.host .bubble::after{left:-12px;bottom:22px;border-right:0;border-bottom:3px solid var(--line);border-left:3px solid var(--line);transform:rotate(45deg)}
.qcard{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:26px;padding:20px 22px;box-shadow:0 6px 0 #120e3a;position:relative}
.qcard .qno{position:absolute;top:-18px;left:20px;background:var(--peach);border:3px solid var(--line);border-radius:999px;padding:1px 14px;font-family:var(--f-display);font-weight:800}
.qcard h2{font-size:clamp(1.2rem,2.6vw,1.6rem);font-weight:700;margin-top:6px}
.timer{height:10px;border-radius:999px;background:var(--sky-soft);border:2px solid var(--line);margin-top:12px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--mint);transition:width 1s linear}
.timer.low i{background:var(--berry)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--lav-soft);color:var(--ink);border:3px solid var(--line);border-radius:999px;padding:10px 18px 10px 10px;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 #120e3a;min-height:62px;transition:transform .12s, background .15s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt .k{flex:none;width:38px;height:38px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.sel{background:var(--sun)}
.opt.sel .k{background:var(--peach)}
.opt.pending{animation:pend .5s ease-in-out infinite alternate}
@keyframes pend{to{background:#ffab4a}}
.opt.ok{background:var(--mint);animation:none}
.opt.ok .k{background:#fff}
.opt.bad{background:#ffb3bd;animation:none}
.opt.gone{opacity:.25;visibility:visible}
.opt:disabled{cursor:default}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
.actions .sp{flex:1}
.lifelines{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.ll{display:flex;align-items:center;gap:8px;border:2.5px solid #fff;background:rgba(255,255,255,.1);color:#fff;border-radius:16px;padding:6px 12px 6px 6px;font-weight:800;font-size:.92rem}
.ll .ic{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:2px solid var(--line)}
.ll .ic svg{width:28px;height:28px}
.ll:hover:not(:disabled){background:rgba(255,255,255,.22)}
.ll:disabled{opacity:.35;text-decoration:line-through}
.llbox{margin-top:14px;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:20px;padding:14px 16px}
.aud{display:flex;gap:14px;align-items:flex-end;height:150px;padding-top:8px}
.aud .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.aud .bar i{display:block;width:100%;max-width:56px;border:2.5px solid var(--line);border-radius:10px 10px 4px 4px;background:var(--sky);transform-origin:bottom;animation:grow .8s cubic-bezier(.3,1.4,.6,1)}
@keyframes grow{from{transform:scaleY(0)}}
.owlsay{display:flex;gap:12px;align-items:center}
.owlsay svg{width:70px;height:70px;flex:none}

.explain{margin-top:18px;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:26px;padding:20px 22px;box-shadow:0 6px 0 #120e3a}
.explain .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.explain .head svg{width:54px;height:54px;flex:none}
.explain .verdict{font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.explain .verdict.ok{color:var(--mint-deep)} .explain .verdict.bad{color:#c7344a}
.explain .ans{margin-top:10px;font-weight:800;background:var(--mint);border:2.5px solid var(--line);border-radius:14px;padding:8px 12px;display:inline-block}
.explain .body{margin-top:12px;display:grid;gap:10px;max-width:68ch;font-size:1.05rem}
.explain .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.explain .actions{margin-top:16px}

.ladder{background:rgba(255,255,255,.08);border:2.5px solid rgba(255,255,255,.5);border-radius:22px;padding:12px;align-self:start;position:sticky;top:76px}
.ladder h3{color:#fff;font-size:1rem;margin:2px 4px 8px;display:flex;justify-content:space-between}
.ladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:3px}
.ladder li{white-space:nowrap;display:flex;justify-content:space-between;gap:8px;padding:3px 10px;border-radius:10px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;color:#dcd6ff}
.ladder li .q{opacity:.8;width:24px}
.ladder li.safe{color:var(--sun)}
.ladder li.done{color:var(--mint)}
.ladder li.cur{background:var(--sun);color:var(--ink);border:2px solid var(--line)}
.scorebox{background:rgba(255,255,255,.08);border:2.5px solid rgba(255,255,255,.5);border-radius:22px;padding:16px;align-self:start;position:sticky;top:76px;display:grid;gap:10px;text-align:center}
.scorebox .big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.scorebox .dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.scorebox .dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5)}
.scorebox .dots i.ok{background:var(--mint)} .scorebox .dots i.bad{background:var(--berry)} .scorebox .dots i.cur{background:var(--sun)}
.stopconfirm{background:var(--peach-soft);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700}

/* ---------- results ---------- */
.result{max-width:920px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.res-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.res-hero svg.mc{width:150px;height:auto}
.res-hero h1{font-size:clamp(1.8rem,4.6vw,2.8rem)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
.stat{border:2.5px solid var(--line);border-radius:18px;padding:10px 14px;background:var(--sky-soft)}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-weight:700;font-size:.88rem;color:var(--ink-soft)}
.stat.y{background:#fff5d1} .stat.g{background:#e3fbf1} .stat.r{background:#ffeef0} .stat.l{background:var(--lav-soft)}
.review{display:grid;gap:12px}
.rv{border:2.5px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--card)}
.rv .q{font-weight:800}
.rv .a{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.rv .a span{border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-weight:700;font-size:.92rem}
.rv .a .ok{background:var(--mint)} .rv .a .bad{background:#ffb3bd}
.rv p{font-size:.97rem;color:var(--ink-soft)}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.newbadges{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- profile ---------- */
.prof{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
.avbig{display:flex;justify-content:center;background:radial-gradient(circle at 50% 60%, var(--lav-soft) 0 60%, transparent 61%), var(--sky-soft);border:3px solid var(--line);border-radius:24px;padding:12px}
.avbig svg{width:200px;height:auto}
.editor{display:grid;gap:12px;margin-top:14px}
.editor .lbl{font-weight:800;font-size:.88rem;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line)}
.sw[aria-pressed="true"]{outline:3px solid var(--sky-deep);outline-offset:2px}
.opts-s{display:flex;flex-wrap:wrap;gap:6px}
.opts-s button{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:4px 10px;font-weight:700;font-size:.88rem}
.opts-s button[aria-pressed="true"]{background:var(--sun)}
.opts-s button:disabled{opacity:.45}
.opts-s button .lock{font-size:.75rem;color:var(--ink-soft);margin-left:4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:2.5px solid var(--line);border-radius:18px;padding:12px;text-align:center;background:var(--card);display:grid;gap:4px;justify-items:center}
.badge svg{width:56px;height:56px}
.badge b{font-family:var(--f-display);font-size:1rem;line-height:1.2}
.badge small{font-size:.8rem;color:var(--ink-soft);font-weight:600}
.badge.off{filter:grayscale(1);opacity:.5}
.tbars{display:grid;gap:8px}

function tone(seq){ if(!PREF.sound)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.85});}catch(e){} }
const SFX={tap:()=>tone([[660,.07]]),lock:()=>tone([[330,.12],[392,.12],[440,.2]]),ok:()=>tone([[523,.12],[659,.12],[784,.25]]),bad:()=>tone([[300,.18,'sawtooth'],[220,.3,'sawtooth']]),win:()=>tone([[523,.1],[659,.1],[784,.1],[1047,.35]]),help:()=>tone([[880,.08],[988,.12]])};

/* ===================== Confetti ===================== */
function confetti(n=90){ if(PREF.rm)return; const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#ffd451','#8ee3c3','#c3b3f5','#ffb894','#8fd0f7','#ef5a6f'];
 const P=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:Math.random()*8+5,c:rnd(cols),r:Math.random()*6,vr:(Math.random()-.5)*.3}));
 let f=0;(function step(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(++f<110)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height)})();}

/* ===================== Data loading & validation ===================== */
async function loadData(){
  const seen=new Set();
  await Promise.all(TOPICS.map(async t=>{
    t.questions=[];t.status='missing';
    try{
      const r=await fetch(DATA_DIR+t.file+'.json');
      if(!r.ok)throw new Error('HTTP '+r.status);
      const arr=await r.json();
      if(!Array.isArray(arr))throw new Error('không phải mảng');
      t.raw=arr;t.status='ok';
    }catch(e){t.err=String(e.message||e)}
  }));
  // validate in file order so duplicate detection is deterministic
  TOPICS.forEach(t=>{
    if(!t.raw)return;
    t.raw.forEach((q,i)=>{
      const where=`${t.file} #${i+1}`;
      const need=['id','cau_hoi','A','B','C','D','dap_an','giai_thich','muc_do'];
      const miss=need.filter(k=>q[k]===undefined||q[k]===null||String(q[k]).trim()==='');
      if(miss.length){ISSUES.push(`${where}: thiếu trường ${miss.join(', ')}`);return}
      const ans=String(q.dap_an).trim().toUpperCase();
      if(!LET.includes(ans)){ISSUES.push(`${where} (${q.id}): đáp án "${q.dap_an}" ngoài A–D`);return}
      const opts=LET.map(k=>String(q[k]).trim());
      if(new Set(opts).size<4){ISSUES.push(`${where} (${q.id}): có phương án trùng nhau`);return}
      const lv=parseInt(q.muc_do,10);
      if(!(lv>=1)){ISSUES.push(`${where} (${q.id}): mức độ không hợp lệ`);return}
      if(seen.has(q.id)){ISSUES.push(`${where}: ID trùng ${q.id}`);return}
      seen.add(q.id);
      const item={id:q.id,topic:t.file,chu_de:q.chu_de||t.name,linh_vuc:q.linh_vuc||'',lv,cau_hoi:q.cau_hoi,opts:LET.map(k=>q[k]),ans:LET.indexOf(ans),giai_thich:q.giai_thich};
      t.questions.push(item);BANK.push(item);
      if(!t.field&&q.linh_vuc)t.field=q.linh_vuc;
    });
    delete t.raw;
    if(!t.questions.length)t.status='missing';
  });
  TOPICS.forEach(t=>{if(!t.field)t.field=/Lich_su|co_dai/.test(t.file)?'Lịch sử':'Địa lý'});
}

/* ===================== GAME ===================== */
function pickMillion(pool){
  // câu i dùng mức độ gần nhất với mục tiêu; ưu tiên đúng mức, không lặp ID
  const ML=maxLv(); const used=new Set(); const out=[];
  for(let i=1;i<=15;i++){
    const target=Math.max(1,Math.round(1+(i-1)*(ML-1)/14));
    let q=null;
    for(let d=0;d<ML&&!q;d++){
      for(const lv of d?[target+d,target-d]:[target]){
        const c=shuffle(pool.filter(x=>x.lv===lv&&!used.has(x.id)));
        if(c.length){q=c[0];break}
      }
    }
    if(!q)return null;
    used.add(q.id);out.push(q);
  }
  return out;
}
function pickFree(pool,cfg){
  const f=pool.filter(q=>q.lv>=cfg.min&&q.lv<=cfg.max);
  const n=cfg.count==='all'?f.length:cfg.count;
  return shuffle(f).slice(0,n).sort((a,b)=>a.lv-b.lv);
}
function startGame(customQs){
  const cfg={...SETUP,topics:new Set(SETUP.topics)};
  const pool=poolFor(cfg);
  let qs = customQs || (cfg.mode==='million'?pickMillion(pool):pickFree(pool,cfg));
  if(!qs||!qs.length){go('setup');return}
  SFX.lock();
  G={cfg,mode:customQs?'free':cfg.mode,pool,qs,idx:0,sel:null,locked:false,revealed:false,used:new Set(qs.map(q=>q.id)),
     ll:{half:false,aud:false,owl:false,swap:false},hidden:new Set(),llbox:'',log:[],start:Date.now(),timeLeft:0,tick:null,stopAsk:false,review:!!customQs};
  if(customQs)G.cfg.timer=0;
  go('play');
}

        ${M?`<div class="lifelines" aria-label="Quyền trợ giúp">

}
function ladderHTML(){

   ${PRIZES.map((p,i)=>{let c=[];if(SAFE.includes(i+1))c.push('safe');if(i<G.idx||(i===G.idx&&G.revealed&&G.lastOk))c.push('done');if(i===G.idx)c.push('cur');
     return `<li class="${c.join(' ')}"><span class="q">${i+1}</span><span class="full">${fmt(p)}${SAFE.includes(i+1)?' ★':''}</span><span class="short">${p<1e6?p/1000+'K':p/1e6+' Tr'}${SAFE.includes(i+1)?'★':''}</span></li>`}).join('')}

function paras(txt){

  return out.map(p=>`<p>${esc(p)}</p>`).join('');
}
function explainHTML(q){

    <div class="body">${paras(q.giai_thich)}</div>
    <div class="meta"><span class="chip">${esc(q.chu_de)}</span><span class="chip">${esc(q.linh_vuc)}</span><span class="chip">Mức độ ${q.lv}</span><span class="chip muted">${esc(q.id)}</span></div>
    ${M&&G.lastOk&&SAFE.includes(G.idx+1)?`<div class="notice" style="margin-top:12px">Em đã chạm mốc an toàn ${fmt(PRIZES[G.idx])} điểm thưởng!</div>`:''}

function bindPlay(){
  app().querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>select(+b.dataset.o));
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  on('lock',lockIn);
  on('skip',()=>{G.sel=null;lockIn(true)});
  on('next',next);
  on('quit',()=>{stopTimer();G=null;go('home')});
  on('stop',()=>{G.stopAsk=true;renderPlay()});
  on('stopNo',()=>{G.stopAsk=false;renderPlay()});
  on('stopYes',()=>finish('stop'));
  app().querySelectorAll('[data-ll]').forEach(b=>b.onclick=()=>useLL(b.dataset.ll));
  if(G.cfg.timer&&G.mode==='free'&&!G.locked&&!G.tick)startTimer();
}
function select(i){if(!G||G.locked||G.hidden.has(i))return;SFX.tap();G.sel=i;G.line=rnd(LINES.think);renderPlay();const b=app().querySelector('#lock');if(b)b.focus({preventScroll:true})}
function startTimer(){G.timeLeft=G.cfg.timer;G.tick=setInterval(()=>{G.timeLeft--;const tb=$('#tbar'),tn=$('#tnum');if(tb){tb.style.width=(G.timeLeft/G.cfg.timer*100)+'%';tb.parentNode.classList.toggle('low',G.timeLeft<=5)}if(tn)tn.textContent=G.timeLeft+' giây';
  if(G.timeLeft<=0){stopTimer();G.timeout=true;G.sel=null;lockIn(true)}},1000)}
function stopTimer(){if(G&&G.tick){clearInterval(G.tick);G.tick=null}}
function lockIn(skip){
  if(G.locked)return; if(!skip&&G.sel===null)return;
  stopTimer();G.locked=true;G.stopAsk=false;G.line=rnd(LINES.nervous);SFX.lock();renderPlay();
  const wait=skip?250:(PREF.rm?500:1600);
  setTimeout(()=>{
    const q=curQ();G.lastOk=G.sel===q.ans;G.revealed=true;
    G.log.push({q,sel:G.sel,ok:G.lastOk,timeout:!!G.timeout});
    G.line=G.timeout?LINES.time[0]:G.lastOk?rnd(LINES.ok):rnd(LINES.bad);
    if(G.lastOk){SFX.ok();confetti(G.mode==='million'&&G.idx===14?200:50)}else SFX.bad();
    renderPlay();
    const n=$('#next');if(n)n.focus({preventScroll:true});
  },wait);
}
function next(){
  const M=G.mode==='million';
  if(M&&!G.lastOk)return finish('wrong');
  if(G.idx===G.qs.length-1)return finish(M?'win':'done');
  G.idx++;Object.assign(G,{sel:null,locked:false,revealed:false,hidden:new Set(),llbox:'',line:null,timeout:false});
  renderPlay();window.scrollTo({top:0,behavior:'auto'});
}
/* ---------- lifelines ---------- */
function useLL(k){
  if(G.ll[k]||G.locked)return;
  const q=curQ();
  const p=Math.max(.3,.9-(q.lv-1)*(.55/Math.max(1,maxLv()-1))); // xác suất "đúng" giảm theo độ khó
  if(k==='half'){
    const wrong=shuffle([0,1,2,3].filter(i=>i!==q.ans&&!G.hidden.has(i))).slice(0,2);
    wrong.forEach(i=>G.hidden.add(i));if(wrong.includes(G.sel))G.sel=null;
    G.llbox=`<b>50:50</b> đã ẩn hai đáp án sai. Còn lại hai lựa chọn!`;G.line='Còn hai đáp án thôi!';
  }
  if(k==='aud'){
    const live=[0,1,2,3].filter(i=>!G.hidden.has(i));
    const top=Math.random()<p?q.ans:rnd(live.filter(i=>i!==q.ans));
    const w={};live.forEach(i=>w[i]=Math.random()*20+5);w[top]+=40+Math.random()*30;
    if(top!==q.ans)w[q.ans]+=15; // khán giả vẫn có một phần nghĩ đúng
    const tot=Object.values(w).reduce((a,b)=>a+b,0);const pct=[0,0,0,0];live.forEach(i=>pct[i]=Math.round(w[i]/tot*100));
    const diff=100-pct.reduce((a,b)=>a+b,0);pct[top]+=diff;
    G.llbox=`<b>Khán giả nhí bình chọn</b> <span class="muted" style="font-size:.85rem">(mô phỏng, câu càng khó khán giả càng phân vân)</span>
      <div class="aud">${pct.map((v,i)=>`<div class="bar"><span>${G.hidden.has(i)?'–':v+'%'}</span><i style="height:${Math.max(3,Math.round(v*1.05))}px"></i><span>${LET[i]}</span></div>`).join('')}</div>`;
    G.line='Cùng xem các bạn khán giả nghĩ gì!';
  }
  if(k==='owl'){
    const live=[0,1,2,3].filter(i=>!G.hidden.has(i));
    const right=Math.random()<Math.min(.95,p+.05);
    const pick=right?q.ans:rnd(live.filter(i=>i!==q.ans));
    const conf=p>.75?'Bác khá chắc chắn':p>.5?'Bác nghĩ là':'Câu này khó đấy, bác chỉ đoán thôi';
    G.llbox=`<div class="owlsay">${owlSVG()}<div><b>Cú thông thái nói:</b> “${conf}: đáp án <b>${LET[pick]}. ${esc(q.opts[pick])}</b>. Nhưng em hãy tự suy nghĩ thêm nhé!”<div class="muted" style="font-size:.82rem;margin-top:4px">Gợi ý của cú không phải lúc nào cũng đúng.</div></div></div>`;
    G.line='Cú thông thái đã lên tiếng!';
  }
  if(k==='swap'){
    const cands=lv=>G.pool.filter(x=>!G.used.has(x.id)&&x.lv===lv);
    let rep=null;
    for(let d=0;d<=2&&!rep;d++){for(const lv of d?[q.lv+d,q.lv-d]:[q.lv]){
      const same=shuffle(cands(lv).filter(x=>x.topic===q.topic));const any=shuffle(cands(lv));
      rep=same[0]||(d===0?any[0]:null)||rep;if(rep)break}}
    if(!rep){G.llbox='Không còn câu tương đương để đổi trong phạm vi này. Quyền “Đổi câu” vẫn được giữ lại.';renderPlay();return}
    G.used.add(rep.id);G.qs[G.idx]=rep;G.hidden=new Set();G.sel=null;
    G.llbox=`<b>Đổi câu</b> thành công! Đây là câu mới cùng độ khó.`;G.line='Một câu hỏi mới toanh!';
  }
  G.ll[k]=true;SFX.help();renderPlay();
}

/* ---------- finish ---------- */
function finish(reason){
  stopTimer();
  const M=G.mode==='million', log=G.log, ok=log.filter(l=>l.ok).length;
  let passed=0,prize=0;
  if(M){passed=log.filter(l=>l.ok).length;
    if(reason==='wrong')prize=passed>=10?PRIZES[9]:passed>=5?PRIZES[4]:0;
    else prize=passed?PRIZES[passed-1]:0;}
  // XP & stats
  let xp=M?passed*15+(reason==='win'?100:0):ok*10;
  let stars=0;
  if(M)stars=passed>=15?3:passed>=10?2:passed>=5?1:0;
  else{const r=log.length?ok/log.length:0;stars=r>=.9?3:r>=.7?2:r>=.5?1:0}
  const before=new Set(PROFILE.badges);
  PROFILE.xp+=xp;PROFILE.stars+=stars;PROFILE.games++;
  log.forEach(l=>{PROFILE.answered++;if(l.ok)PROFILE.correct++;const T=PROFILE.topics[l.q.topic]||(PROFILE.topics[l.q.topic]={answered:0,correct:0});T.answered++;if(l.ok)T.correct++});
  if(M)PROFILE.bestMillion=Math.max(PROFILE.bestMillion,passed);
  if(!M&&log.length>=10&&ok===log.length)PROFILE.perfect++;
  BADGES.forEach(b=>{if(!before.has(b.id)&&b.test(PROFILE))PROFILE.badges.push(b.id)});
  const fresh=PROFILE.badges.filter(b=>!before.has(b));
  const secs=Math.round((Date.now()-G.start)/1000);
  PROFILE.history.unshift({at:Date.now(),mode:G.review?'review':G.mode,scope:G.cfg.scope==='all'?'Tất cả chủ đề':[...G.cfg.topics].map(f=>TOPICS.find(t=>t.file===f).name).join(', '),ok,n:log.length,passed,prize,reason});
  PROFILE.history=PROFILE.history.slice(0,30);
  saveProfile();
  const R={reason,M,log,ok,passed,prize,xp,stars,fresh,secs,cfg:G.cfg,review:G.review};
  if(reason==='win'||(!M&&log.length&&ok/log.length>=.7)){SFX.win();confetti(160)}
  G=null;go('result',R);
}

function rvHTML(l){const q=l.q;return `<article class="rv"><div class="row" style="gap:6px;margin-bottom:6px"><span class="chip">${esc(q.chu_de)}</span><span class="chip">Mức ${q.lv}</span></div>

/* ===================== PROFILE ===================== */

/* Hồ sơ của tài khoản mới: chuyển tiến trình chơi khách (nếu có) vào tài khoản */
function freshProfile(nick){
  const g=store.get('profile',null);let prof=NEWPROFILE();
  if(g&&g.games>0){prof=Object.assign(NEWPROFILE(),g);store.set('profile',NEWPROFILE())}
  if(nick)prof.nick=nick;return prof;
}
function setUser(id,email,prof){USER={id,email};CUR=email;PROFILE=Object.assign(NEWPROFILE(),prof)}

/* ---------- Supabase ---------- */
let SYNC_T=null, SYNC_STATE='';
async function pushProfile(){
  if(!SB||!USER)return;
  const {error}=await SB.from('profiles').upsert({id:USER.id,nickname:PROFILE.nick,data:PROFILE,updated_at:new Date().toISOString()});
  SYNC_STATE=error?'Chưa đồng bộ được, sẽ thử lại khi em chơi tiếp':'Đã đồng bộ';
}
async function cloudLogin(user){
  let prof=null;
  try{const {data,error}=await SB.from('profiles').select('data').eq('id',user.id).maybeSingle();if(error)throw error;prof=data&&data.data}
  catch(e){prof=store.get('cloud_'+user.id,null);SYNC_STATE='Đang dùng bản lưu trên máy, chưa kết nối được máy chủ'}
  const isNew=!prof;
  if(isNew)prof=freshProfile(user.user_metadata&&user.user_metadata.nickname);
  setUser(user.id,user.email,prof);
  if(isNew)await pushProfile();
  store.set('cloud_'+user.id,PROFILE);
}
async function initAuth(){
  if(!CLOUD){ // khôi phục phiên tài khoản trên máy
    let e=null;try{e=localStorage.getItem('chibi_session')}catch(_){}
    if(e&&LACC[e])setUser('local:'+e,e,LACC[e].profile);
    return;
  }
  if(!window.supabase||!window.supabase.createClient){CLOUD_ERR='Không tải được thư viện đăng nhập. Kiểm tra kết nối mạng rồi tải lại trang.';return}
  if(/type=recovery/.test(location.hash+location.search))RECOVERY=true; // đọc trước khi thư viện xóa token khỏi URL
  try{
    SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    SB.auth.onAuthStateChange((ev,session)=>{
      if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;if(session&&!USER)USER={id:session.user.id,email:session.user.email};if(DATA_READY)go('reset')}
    });
    const {data:{session}}=await SB.auth.getSession();
    if(session&&RECOVERY)USER={id:session.user.id,email:session.user.email};
    else if(session)await cloudLogin(session.user);
  }catch(e){CLOUD_ERR='Không kết nối được máy chủ đăng nhập: '+(e.message||e)}
}

/* ---------- Một bộ thao tác chung cho cả hai chế độ ---------- */
const redirect=()=>location.origin+location.pathname;
const AUTH={
  async signIn(email,pw){
    if(Date.now()<LOGIN_LOCK)throw new Error('LOCKED');
    if(CLOUD){
      const {data,error}=await SB.auth.signInWithPassword({email,password:pw});
      if(error){if(/Invalid login/i.test(error.message))bumpFail();throw error}
      LOGIN_FAILS=0;await cloudLogin(data.user);return;
    }
    const a=LACC[email];
    if(!a||(await hashPw(pw,a.salt))!==a.hash){bumpFail();throw new Error('Invalid login credentials')}
    LOGIN_FAILS=0;try{localStorage.setItem('chibi_session',email)}catch(_){}
    setUser('local:'+email,email,a.profile);
  },
  async signUp(email,pw,nick){ // trả về true nếu cần xác nhận email
    if(CLOUD){
      const {data,error}=await SB.auth.signUp({email,password:pw,options:{data:{nickname:nick},emailRedirectTo:redirect()}});
      if(error)throw error;
      if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)throw new Error('User already registered');
      if(data.session){await cloudLogin(data.user);return false}
      return true;
    }
    if(LACC[email])throw new Error('User already registered');
    const salt=newSalt();
    LACC[email]={salt,hash:await hashPw(pw,salt),profile:freshProfile(nick),createdAt:Date.now(),lastPlayed:0};saveLacc();
    try{localStorage.setItem('chibi_session',email)}catch(_){}
    setUser('local:'+email,email,LACC[email].profile);return false;
  },
  async forgot(email){
    if(!CLOUD)throw new Error('NO_EMAIL_SERVER');
    const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:redirect()});if(error)throw error;
  },
  async updatePassword(pw){
    if(CLOUD){const {data,error}=await SB.auth.updateUser({password:pw});if(error)throw error;await cloudLogin(data.user);return}
    const a=LACC[CUR];if(!a)throw new Error('Không tìm thấy tài khoản');
    if((await hashPw(pw,a.salt))===a.hash)throw new Error('same_password');
    a.salt=newSalt();a.hash=await hashPw(pw,a.salt);saveLacc();
  },
  async signOut(){
    if(CLOUD&&SB){await SB.auth.signOut();return}
    try{localStorage.removeItem('chibi_session')}catch(_){}
  },
};
function bumpFail(){LOGIN_FAILS++;if(LOGIN_FAILS>=5){LOGIN_LOCK=Date.now()+30000;LOGIN_FAILS=0}}
function viErr(e){
  const m=String((e&&e.message)||e||'');const c=String((e&&(e.code||e.status))||'');
  if(m==='LOCKED')return `Nhập sai nhiều lần. Hãy thử lại sau ${Math.max(1,Math.ceil((LOGIN_LOCK-Date.now())/1000))} giây.`;
  if(m==='NO_EMAIL_SERVER')return 'Bản này chưa kết nối máy chủ email nên chưa gửi được liên kết đặt lại mật khẩu.';
  if(/Invalid login credentials/i.test(m))return 'Email hoặc mật khẩu chưa đúng.';
  if(/Email not confirmed/i.test(m))return 'Email này chưa được xác nhận. Hãy mở email xác nhận và bấm vào liên kết trước khi đăng nhập.';
  if(/not authorized|email_address_not_authorized/i.test(m+c))return 'Hệ thống chưa gửi được email tới địa chỉ này (máy chủ email chưa được cài đặt). Hãy báo người quản lý website.';
  if(/already registered|already been registered|user_already_exists/i.test(m+c))return 'Email này đã có tài khoản. Hãy đăng nhập, hoặc dùng “Quên mật khẩu?”.';
  if(/rate limit|over_email_send_rate_limit|429/i.test(m+c))return 'Đã gửi email quá nhiều lần. Hãy đợi vài phút rồi thử lại.';
  if(/Password should be at least|weak_password/i.test(m+c))return 'Mật khẩu cần ít nhất 6 ký tự.';
  if(/same_password|should be different/i.test(m+c))return 'Mật khẩu mới phải khác mật khẩu cũ.';
  if(/valid email|email_address_invalid|Unable to validate email/i.test(m+c))return 'Địa chỉ email chưa hợp lệ.';
  if(/fetch|network/i.test(m))return 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.';
  return m||'Có lỗi xảy ra, hãy thử lại.';
}

  const title=T==='forgot'||T==='sent'?'Quên mật khẩu':T==='up'||T==='confirm'?'Tạo tài khoản':'Đăng nhập';
  app().innerHTML=`<div class="wrap screen"><div class="authwrap"><section class="panel">
     <div class="authhead">${avatarSVG(MC_AV,'hello','mc')}<div><p class="eyebrow">Chào nhà thám hiểm</p><h1>${title}</h1></div></div>
     ${CLOUD_ERR?`<div class="notice warn" style="margin-top:12px">${esc(CLOUD_ERR)}</div>`:''}
     ${T==='in'||T==='up'?tabs:''}${body}
     ${T==='in'||T==='up'?'<button class="btn white sm guestbtn" id="guest">Chơi thử không cần tài khoản</button>':''}
     ${!CLOUD?'<p class="muted devnote">Bản xem thử: tài khoản được lưu trên máy này. Khi website kết nối Supabase, tài khoản sẽ đồng bộ mọi máy và lấy lại được mật khẩu qua email.</p>':''}
   </section></div></div>`;
  app().querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{AUTH_TAB=b.dataset.tab;renderLogin()});
  app().querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const p=$('#'+b.dataset.show);p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Hiện':'Ẩn'});
  const on=(id,f)=>{const x=$('#'+id);if(x)x.onclick=f};
  on('guest',()=>go('home'));
  on('toForgot',()=>{const e=$('#ae');if(e)AUTH_EMAIL=e.value.trim();AUTH_TAB='forgot';renderLogin()});
  const f=$('#authForm');if(!f)return;
  if(matchMedia('(hover:hover)').matches){const first=f.querySelector('input');if(first)first.focus()}
  const err=m=>{const x=$('#aerr');x.textContent=m;x.hidden=!m;if(m)x.scrollIntoView({block:'nearest',behavior:'smooth'})};
  f.onsubmit=async e=>{e.preventDefault();err('');
    if(CLOUD&&!SB){err(CLOUD_ERR||'Chưa kết nối được máy chủ đăng nhập.');return}
    const email=$('#ae').value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err('Địa chỉ email chưa hợp lệ.');return}
    AUTH_EMAIL=email;
    const btn=$('#abtn'),label=btn.textContent;btn.disabled=true;btn.textContent='Đang xử lý…';
    const done=()=>{btn.disabled=false;btn.textContent=label};
    try{
      if(T==='in'){
        const p=$('#ap').value;if(!p){done();err('Hãy nhập mật khẩu.');return}
        await AUTH.signIn(email,p);SFX.ok();go('home');
      }else if(T==='up'){
        const nick=$('#an').value.trim(),p=$('#ap').value,p2=$('#ap2').value;
        if(!nick){done();err('Hãy đặt một biệt danh cho bé.');return}
        if(p.length<6){done();err('Mật khẩu cần ít nhất 6 ký tự.');return}
        if(p!==p2){done();err('Hai lần nhập mật khẩu chưa khớp.');return}
        if(!$('#aok').checked){done();err('Cần phụ huynh đồng ý trước khi tạo tài khoản.');return}
        const needConfirm=await AUTH.signUp(email,p,nick);
        if(needConfirm){AUTH_TAB='confirm';renderLogin()}else{AUTH_TAB='in';SFX.ok();confetti(60);go('home')}
      }else if(T==='forgot'){
        await AUTH.forgot(email);AUTH_TAB='sent';renderLogin();
      }
    }catch(ex){done();SFX.bad();err(viErr(ex))}
  };
}
/* ---------- Đặt mật khẩu mới (từ email hoặc khi đang đăng nhập) ---------- */
function renderReset(){
  const ok=!!USER;
  app().innerHTML=`<div class="wrap screen"><div class="authwrap"><section class="panel">
    <div class="authhead">${owlSVG()}<div><p class="eyebrow">${RECOVERY?'Lấy lại mật khẩu':'Bảo mật tài khoản'}</p><h1>Đặt mật khẩu mới</h1></div></div>
    ${ok?`<p style="font-weight:600;margin-top:10px;overflow-wrap:anywhere">Tài khoản: <b>${esc(USER.email)}</b></p>
    <form id="rsForm" class="form" novalidate>
      <div class="field"><label for="r1">Mật khẩu mới</label><div class="pwrow"><input type="password" id="r1" autocomplete="new-password"><button type="button" class="btn sm white" id="r1s">Hiện</button></div><small class="muted hint">Ít nhất 6 ký tự.</small></div>
      <div class="field"><label for="r2">Nhập lại mật khẩu mới</label><input type="password" id="r2" autocomplete="new-password"></div>
      <div id="rerr" class="notice warn" hidden></div><div id="rok" class="notice" hidden></div>
      <button class="btn" type="submit" id="rbtn">Lưu mật khẩu mới</button>
      ${RECOVERY?'':'<button type="button" class="linkbtn" id="rcancel">Để sau</button>'}
    </form>`:`<div class="notice warn" style="margin-top:12px">Liên kết đặt lại mật khẩu đã hết hạn hoặc đã được dùng. Hãy yêu cầu một liên kết mới.</div><button class="btn sm" id="again" style="margin-top:12px">Gửi lại liên kết</button>`}
  </section></div></div>`;
  const on=(id,f)=>{const x=$('#'+id);if(x)x.onclick=f};
  on('again',()=>{AUTH_TAB='forgot';go('login')});
  on('rcancel',()=>go('profile'));
  on('r1s',()=>{const p=$('#r1'),s=$('#r1s');p.type=p.type==='password'?'text':'password';s.textContent=p.type==='password'?'Hiện':'Ẩn'});
  const f=$('#rsForm');if(!f)return;
  f.onsubmit=async e=>{e.preventDefault();const err=m=>{const x=$('#rerr');x.textContent=m;x.hidden=!m};err('');
    const p1=$('#r1').value,p2=$('#r2').value;
    if(p1.length<6){err('Mật khẩu cần ít nhất 6 ký tự.');return}
    if(p1!==p2){err('Hai lần nhập mật khẩu chưa khớp.');return}
    const b=$('#rbtn');b.disabled=true;b.textContent='Đang lưu…';
    try{await AUTH.updatePassword(p1);
      RECOVERY=false;try{history.replaceState(null,'',location.pathname)}catch(_){}
      SFX.ok();const okb=$('#rok');okb.textContent='Đã đổi mật khẩu! Đang đưa em về bản đồ…';okb.hidden=false;setTimeout(()=>go('home'),1300);
    }catch(ex){b.disabled=false;b.textContent='Lưu mật khẩu mới';err(viErr(ex))}};
}

function renderFoot(){
  $('#foot').innerHTML=`<span>Câu hỏi lấy nguyên văn từ ${avail().length} ngân hàng câu hỏi (${fmt(BANK.length)} câu).${ISSUES.length?` Bỏ qua ${ISSUES.length} bản ghi lỗi.`:' Dữ liệu hợp lệ.'}</span><span>Phím tắt khi chơi: A–D hoặc 1–4 để chọn, Enter để chốt / đi tiếp.</span>`;
  if(ISSUES.length)console.warn('Vấn đề dữ liệu:',ISSUES);
}

/* ===================== global controls ===================== */
function applyPref(){document.documentElement.classList.toggle('rm',PREF.rm);$('#soundBtn').setAttribute('aria-pressed',PREF.sound);$('#soundBtn').innerHTML=(PREF.sound?ICO.soundOn:ICO.soundOff)+`<span class="lbl">${PREF.sound?'Âm thanh bật':'Âm thanh tắt'}</span>`;$('#soundBtn').setAttribute('aria-label',PREF.sound?'Tắt âm thanh':'Bật âm thanh');$('#motionBtn').setAttribute('aria-pressed',PREF.rm);$('#motionBtn').innerHTML=(PREF.rm?ICO.still:ICO.motion)+`<span class="lbl">${PREF.rm?'Đã giảm chuyển động':'Giảm chuyển động'}</span>`;$('#motionBtn').setAttribute('aria-label',PREF.rm?'Bật lại chuyển động':'Giảm chuyển động');store.set('pref',PREF)}
$('#soundBtn').onclick=()=>{PREF.sound=!PREF.sound;applyPref();SFX.tap()};
$('#motionBtn').onclick=()=>{PREF.rm=!PREF.rm;applyPref()};
$('#logoBtn').onclick=()=>{if(G){stopTimer();G=null}go('home')};
document.querySelectorAll('.nav [data-go],.tabbar [data-go]').forEach(b=>b.onclick=()=>{if(G){stopTimer();G=null}go(b.dataset.go)});
document.querySelectorAll('[data-ico]').forEach(e=>e.innerHTML=ICO[e.dataset.ico]);
document.addEventListener('keydown',e=>{
  if(screen!=='play'||!G||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k=e.key.toUpperCase();const map={A:0,B:1,C:2,D:3,'1':0,'2':1,'3':2,'4':3};
  if(k in map&&!G.locked){select(map[k]);e.preventDefault()}
  else if(e.key==='Enter'){const n=$('#next')||$('#lock');if(n&&!n.disabled&&document.activeElement!==n){n.click();e.preventDefault()}}
});
applyPref();
Promise.all([loadData(),initAuth()]).then(()=>{DATA_READY=true;go(RECOVERY?'reset':'home')}).catch(e=>{app().innerHTML=`<div class="wrap screen"><div class="notice warn">Không tải được dữ liệu câu hỏi: ${esc(e.message)}</div></div>`});
</script>
